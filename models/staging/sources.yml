version: 2

sources:
  - name: resend_raw
    description: Raw Resend webhook ingester and optional API snapshot tables.
    database: "{{ var('resend_source_database', target.database) }}"
    schema: "{{ var('resend_source_schema', target.schema) }}"
    tables:
      - name: webhook_email_events
        identifier: "{{ var('resend_webhook_email_identifier', 'resend_wh_emails') }}"
        description: Resend email webhook events from the webhook ingester.
        columns:
          - name: svix_id
            tests:
              - not_null
              - unique
          - name: event_type
            tests:
              - not_null
          - name: event_created_at
            tests:
              - not_null
          - name: webhook_received_at
          - name: data
            description: Event-specific JSON payload.

      - name: webhook_contact_events
        identifier: "{{ var('resend_webhook_contact_identifier', 'resend_wh_contacts') }}"
        description: Resend contact webhook events from the webhook ingester.
        columns:
          - name: svix_id
            tests:
              - not_null
              - unique
          - name: event_type
            tests:
              - not_null
          - name: event_created_at
            tests:
              - not_null
          - name: webhook_received_at
          - name: data

      - name: webhook_domain_events
        identifier: "{{ var('resend_webhook_domain_identifier', 'resend_wh_domains') }}"
        description: Resend domain webhook events from the webhook ingester.
        columns:
          - name: svix_id
            tests:
              - not_null
              - unique
          - name: event_type
            tests:
              - not_null
          - name: event_created_at
            tests:
              - not_null
          - name: webhook_received_at
          - name: data

      - name: api_emails
        identifier: "{{ var('resend_api_emails_identifier', 'resend_api_emails') }}"
        description: Optional snapshot of the Resend List Sent Emails endpoint.

      - name: api_contacts
        identifier: "{{ var('resend_api_contacts_identifier', 'resend_api_contacts') }}"
        description: Optional snapshot of the Resend List Contacts endpoint.

      - name: api_broadcasts
        identifier: "{{ var('resend_api_broadcasts_identifier', 'resend_api_broadcasts') }}"
        description: Optional snapshot of the Resend List Broadcasts endpoint.

      - name: api_domains
        identifier: "{{ var('resend_api_domains_identifier', 'resend_api_domains') }}"
        description: Optional snapshot of the Resend List Domains endpoint.
