extends: default

ignore: |
  .venv/
  target/
  dbt_packages/
  logs/
  integration_tests/target/
  integration_tests/dbt_packages/
  integration_tests/logs/
  integration_tests/.user.yml

rules:
  document-start: disable
  line-length:
    max: 120
    level: warning
  truthy:
    allowed-values: ["true", "false", "on"]
